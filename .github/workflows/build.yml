name: Build and release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build against Paper 26.2
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TownyCosmeticsBridge-1.2.1-Paper-26.2
          path: target/TownyCosmeticsBridge-1.2.1.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v1.2.1
          JAR: target/TownyCosmeticsBridge-1.2.1.jar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "TownyCosmeticsBridge 1.2.1" \
              --generate-notes
          fi
