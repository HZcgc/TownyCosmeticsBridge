name: Build plugins and regression tests

on:
  push:
    branches: [ main, 'codex/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Towny plugins, key display and patched QuickShop; run regression tests
        run: |
          python3 -m pip install PyYAML==6.0.2
          python3 tools/build.py
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Upload plugin JARs
        uses: actions/upload-artifact@v4
        with:
          name: TownyReborn-Plugin-Update-2026-10-10
          path: dist/*
          if-no-files-found: error

