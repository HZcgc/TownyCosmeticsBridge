name: Staff HQ and connector
on:
  push:
    branches: [main, "codex/**"]
    paths: ["integrations/staff-hq/**", ".github/workflows/staff-hq.yml"]
  pull_request:
    paths: ["integrations/staff-hq/**", ".github/workflows/staff-hq.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: integrations/staff-hq/source/connector/pom.xml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, mbstring, fileinfo
      - name: PHP syntax and history parser
        working-directory: integrations/staff-hq
        run: |
          rg --files source/web -g '*.php' | xargs -n1 php -l
          python3 tests/history_tests.py
      - name: Verify and build connector
        run: mvn -B -f integrations/staff-hq/source/connector/pom.xml clean verify
      - name: Package HQ 5.1.1 webspace update
        working-directory: integrations/staff-hq
        run: python3 tools/package_web.py
      - uses: actions/upload-artifact@v4
        with:
          name: TownyReborn-StaffHQ-5.1.1-Intuitive-UI
          path: integrations/staff-hq/output/TownyReborn-StaffHQ-5.1.1-Intuitive-UI.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TownyRebornStaffConnector-1.4.0
          path: integrations/staff-hq/source/connector/target/TownyRebornStaffConnector-1.4.0.jar
          if-no-files-found: error
