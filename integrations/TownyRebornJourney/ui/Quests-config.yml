# Current Quests(8) layout; Experience category occupies the previous stone slot (40).
options:
  categories-enabled: true
  trim-gui-size:
    quests-category-menu: false
    quests-menu: false
    quests-started-menu: true
  titles-enabled: true
  bossbar:
    progress: false
    complete: false
    time: 5
    color:
      '0':
        '0': BLUE
    style:
      '0':
        '0': SOLID
  actionbar:
    progress: false
    complete: false
  config-version: c105a57afb4cd9bb5a258c9cdd8afd6a
  quest-limit:
    default: 6
  allow-quest-cancel: true
  allow-quest-track: true
  task-type-exclusions: []
  guinames:
    quests-category: '&d&lTOWNY &a&lREBORN &8• &fQuests'
    quests-menu: '&d&lTOWNY &a&lREBORN &8• &fQuests'
    quests-started-menu: '&d&lTOWNY &a&lREBORN &8• &fActive'
    daily-quests: '&d&lTOWNY &a&lREBORN &8• &fDaily'
    quest-cancel: '&c&lCancel Quest?'
  sounds:
    quest-start: ENTITY_PLAYER_LEVELUP:2:3
    quest-cancel: UI_TOAST_OUT:2:3
    quest-complete: UI_TOAST_CHALLENGE_COMPLETE:1.25:3
    gui:
      open: ITEM_BOOK_PAGE_TURN:1:3
      interact: ITEM_BOOK_PAGE_TURN:1:3
  gui-hide-locked: false
  gui-confirm-cancel: true
  gui-hide-quests-nopermission: false
  gui-hide-categories-nopermission: false
  gui-use-placeholderapi: true
  gui-truncate-requirements: true
  gui-actions:
    start-quest: LEFT
    track-quest: SHIFT_LEFT
    cancel-quest: RIGHT
  quest-autostart: false
  quest-autotrack: true
  verbose-logging-level: 1
  record-log-history: true
  quests-use-placeholderapi: true
  progress-use-placeholderapi: false
  use-progress-as-fallback: true
  playerblocktracker-class-name: com.gestankbratwurst.playerblocktracker.PlayerBlockTracker
  placeholderapi-global-refresh-ticks: 30
  coreprotect-block-lookup-delay: -1
  mobkilling-use-wildstacker-hook: true
  verify-quest-exists-on-load: true
  performance-tweaking:
    quest-queue-executor-interval: 1
    quest-autosave-interval: 12000
  tab-completion:
    enabled: true
  error-checking:
    override-errors: false
  placeholder-cache-time: 10
  global-task-configuration-override: false
  global-quest-display-configuration-override: false
  storage:
    provider: yaml
    synchronisation:
      delay-loading: 0
    database-settings:
      network:
        database: minecraft
        username: root
        password: ''
        address: localhost:3306
      connection-pool-settings:
        maximum-pool-size: 8
        minimum-idle: 8
        maximum-lifetime: 1800000
        connection-timeout: 5000
      table-prefix: quests_
quest-mode:
  mode: NORMAL
global-quest-display:
  lore:
    append-not-started:
    - '&d▶ &fLeft-click to start'
    append-started:
    - '&e▶ Quest in progress'
    - ''
    - '&d▶ &fShift-left-click to track'
    - '&c▶ &fRight-click to cancel'
    append-tracked:
    - '&e▶ Quest in progress'
    - ''
    - '&d◆ &fCurrently tracked'
    - '&d▶ &fShift-left-click to stop tracking'
    - '&c▶ &fRight-click to cancel'
global-macros:
  bar: '&6---%imc_dark-color_c%---&6---'
gui:
  back-button:
    enabled: true
    slot: 45
    name: '&c&lBack to Categories'
    lore:
    - '&7Return to the quest overview.'
    - ''
    - '&c▶ &fClick to return'
    type: ARROW
  page-prev:
    enabled: true
    slot: 48
    name: '&d&lPrevious Page'
    lore:
    - '&7Go to page &f{prevpage}&7.'
    type: ARROW
  page-next:
    enabled: true
    slot: 50
    name: '&a&lNext Page'
    lore:
    - '&7Go to page &f{nextpage}&7.'
    type: ARROW
  page-desc:
    enabled: true
    slot: 49
    name: '&f&lPage &d{page}'
    lore:
    - '&7Use the arrows to browse.'
    type: PAPER
  quest-locked-display:
    name: '&c&lLocked &8• &f{quest}'
    lore:
    - '&7This quest has not been unlocked yet.'
    - ''
    - '&8Required first:'
    - '&f{requirements}'
    - ''
    - '&c✘ Quest locked'
    type: RED_DYE
  quest-permission-display:
    name: '&c&lUnavailable &8• &f{quest}'
    lore:
    - '&7You cannot start this quest yet.'
    - ''
    - '&c✘ No permission'
    type: RED_DYE
  quest-cooldown-display:
    name: '&6&lCooldown &8• &f{quest}'
    lore:
    - '&7This quest is currently on cooldown.'
    - ''
    - '&7Available in: &e{time}'
    type: ORANGE_DYE
  quest-completed-display:
    name: '&a&lCompleted &8• &f{quest}'
    lore:
    - '&7You have completed this quest.'
    - ''
    - '&a✔ Finished'
    type: LIME_DYE
  no-started-quests:
    name: '&d&lNo Active Quests'
    lore:
    - '&7Choose a category and start your journey.'
    type: BOOK
  quest-cancel-yes:
    name: '&c&lYes, Cancel Quest'
    lore:
    - '&7Cancel this quest and lose'
    - '&7all current progress.'
    - ''
    - '&c▶ &fClick to confirm'
    type: RED_CONCRETE
  quest-cancel-no:
    name: '&a&lNo, Keep Quest'
    lore:
    - '&7Return without losing progress.'
    - ''
    - '&a▶ &fClick to return'
    type: LIME_CONCRETE
  quest-cancel-background:
    type: BLACK_STAINED_GLASS_PANE
