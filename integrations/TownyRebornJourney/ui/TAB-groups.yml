# Every rank image already has the same font advance in the ItemsAdder pack.
# Therefore every group uses exactly one separator after the Reborn level: the
# player names stay in one column without the previous oversized rank padding.
# The AFK marker stays in the suffix so it cannot shift the name column.

Owner:
  tabprefix: "\u0020%luckperms_prefix%&f%string_replaceCharacters_small-numbers_{reborn_level}%\u0020&r"
  tagprefix: ''
  customtabname: '%player_displayname%'
  tabsuffix: '%essentials_afk%'
  tagsuffix: ''
