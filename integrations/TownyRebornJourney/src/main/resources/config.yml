# Towny Reborn standalone journey. Access is controlled only by
# townyreborn.progression.access (default false); there is no global pause.
# Each page has 29 milestones. Increase journey.steps and add stable IDs to extend.
# Rank levels depend only on Journey Points; purchases and claims are optional.
# Keep existing perk/gift IDs when editing: receipts and ownership use these IDs.
# Costs are game money; keys use existing ExcellentCrates IDs (patron = Supporter).
# Text colours on signs/anvils and one Player Warp are already free in Default.
# Rewards are FREE and claimed once. Never delete journeydata to retry a reward.
# Town bonuses belong to the town at claim time, not to an individual plot.
# mcMMO/Jobs count new personal high-water gains; first valid value is a baseline.
# Quests integration is optional and disabled; Reborn has no Quests dependency.

permission-context-server: smp
legacy-cleanup:
  enabled: true
journey:
  steps: 116
  points-first: 30
  points-increase: 15
  titles:
    1: Newcomer
    4: Settler
    8: Resident
    12: Citizen
    18: Adventurer
    24: Explorer
    29: Merchant
    36: Pioneer
    45: Artisan
    58: Veteran
    70: Champion
    87: Mythic
    100: Ascendant
    116: Reborn Legend
sources:
