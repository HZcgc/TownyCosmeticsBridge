# Towny Reborn standalone Journey; player access requires townyreborn.progression.access.
# Pages form one continuous snake; completed/next target/future = green/yellow/red.
# Levels depend only on Journey Points. Perk purchases and reward claims are optional.
# Reward IDs must remain stable; legacy-ids preserve previously claimed beta rewards.
# Free rewards are claimed once. Money uses Vault with a durable receipt; never replay receipts.
# No UltraCosmetics grants or permanent daily Supporter-key perk in this catalogue.
# Existing paid rank subscriptions are handled by their own bridge.
# Town rewards go to the town at claim time. All crate-key rewards below are one-time.
# Sources track new personal mcMMO/Jobs highs; first valid value establishes a baseline.
permission-context-server: smp
legacy-cleanup:
  enabled: true
journey:
  steps: 116
  points-first: 30
  points-increase: 15
  titles:
    1: Newcomer
    4: Settler
    8: Resident
    12: Citizen
    18: Adventurer
    24: Explorer
    29: Merchant
    36: Pioneer
    45: Artisan
    58: Veteran
    70: Champion
    87: Mythic
    100: Ascendant
    116: Reborn Legend
  short-titles:
    1: NEW
    4: SET
    8: RES
    12: CIT
    18: ADV
    24: EXP
    29: MER
    36: PIO
    45: ART
    58: VET
    70: CHM
    87: MYT
    100: ASC
    116: LEG
