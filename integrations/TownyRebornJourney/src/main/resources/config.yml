# Towny Reborn Journey 2.0.0. Install with the matching JAR while the server is stopped.
# No external config changes. Access: townyreborn.progression.access.
# Restore pre-reset earned JP once; retain post-reset points, paid perks and delivery receipts.
# Keep both revision values unchanged. Keep history-credits and migration-backups to prevent a repeated credit.
# Profiles are backed up in migration-backups before their first reset; offline profiles migrate on first load.
# UTC 00:00 daily reset; active playtime is capped at 360 JP/day. Other source caps are retained.
# Green = earlier completed level, yellow = current level, red = future locked level.
# All 116 levels have distinct titles. TAB uses a level number plus three title letters, e.g. [1NEW] and [116RLG]; rank palette moves pink to lime.
# /fly is the final Wither feature and requires the final level 116 for a new purchase.
# Keep reward IDs/legacy aliases/receipts: increased rewards never replay already delivered gifts.
