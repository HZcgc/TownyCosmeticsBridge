; Staff HQ itself does not impose an attachment limit. PHP still requires a
; finite per-file ceiling, so this is intentionally above any normal evidence
; upload while post_max_size remains unlimited. Plesk/nginx and disk quotas may
; still define lower physical limits.
upload_max_filesize=10G
post_max_size=0
max_file_uploads=1000
max_execution_time=0
max_input_time=-1
